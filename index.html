<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>SaaS de Gestion Universitaire Piloté par IA</title>
    <script>
      // Thème appliqué dès le chargement, sur TOUTES les pages (y compris
      // /login et /mot-de-passe-oublie, où useTheme n'est pas monté) et sans
      // flash du thème clair. Même logique que src/shared/hooks/useTheme.ts.
      ;(function () {
        var theme = null
        try {
          var stored = localStorage.getItem('uniflow-theme')
          if (stored === 'uniflow-light' || stored === 'uniflow-dark') theme = stored
        } catch (e) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'uniflow-dark'
            : 'uniflow-light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
